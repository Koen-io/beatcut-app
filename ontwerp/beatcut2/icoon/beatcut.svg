<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23272F"/>
      <stop offset="1" stop-color="#0B0C0F"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2FF6B"/>
      <stop offset="1" stop-color="#A9D61C"/>
    </linearGradient>
    <linearGradient id="rand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="gloed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <!-- macOS-raster: 824x824 tegel met 100 px marge -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rand)" stroke-width="3"/>
  <g filter="url(#gloed)" opacity="0.55">
    <rect x="251" y="452" width="62" height="120" rx="31" fill="#C8F135"/>
    <rect x="357" y="352" width="62" height="320" rx="31" fill="#C8F135"/>
    <rect x="611" y="382" width="62" height="260" rx="31" fill="#C8F135"/>
    <rect x="717" y="467" width="62" height="90" rx="31" fill="#C8F135"/>
  </g>
  <rect x="251" y="452" width="62" height="120" rx="31" fill="url(#lime)"/>
  <rect x="357" y="352" width="62" height="320" rx="31" fill="url(#lime)"/>
  <rect x="611" y="382" width="62" height="260" rx="31" fill="url(#lime)"/>
  <rect x="717" y="467" width="62" height="90" rx="31" fill="url(#lime)"/>
  <!-- de snede: wit, door het midden -->
  <rect x="490" y="262" width="44" height="500" rx="22" fill="#F5F6F7"/>
</svg>
