[project]
name = "cve"
version = "0.3.2"
description = "BeatCut Video Editor - AI-gestuurde lokale video-editor"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<2.3",
    "numba>=0.61",
    # Intel-Macs: llvmlite 0.46+ heeft geen x86_64-wheel meer en bouwen uit de
    # bron vraagt LLVM. 0.45 / numba 0.62 zijn de laatste met een wheel.
    "llvmlite<0.46; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numba<0.63; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "opencv-python-headless>=4.10",
    "scenedetect>=0.6.4",
    "librosa>=0.11",
    "soundfile>=0.12",
    "pillow>=10.4",
    "pydantic>=2.9",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
cve = "cve.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/cve"]

[tool.pytest.ini_options]
# Alleen onze eigen tests. Zonder dit raapt pytest ook vendor/ op — ace-step
# alleen levert al 1223 collectiefouten omdat zijn deps hier niet staan.
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
