[package]
name = "beatcut-compositor"
version = "0.1.0"
edition = "2021"
description = "Headless wgpu-compositor: look en afwerking op rauwe RGBA-frames"

[[bin]]
name = "beatcut-compositor"
path = "src/main.rs"

[dependencies]
wgpu = "27"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
