function bindPaneel(){
  const schuif = $('#in-duur');
  if (schuif){
    const bij = () => {
      const min=+schuif.min, max=+schuif.max;
      schuif.style.setProperty('--vul', ((schuif.value-min)/(max-min)*100)+'%');
      $('#duur-uit').textContent = schuif.value + 's';
      S.doelduur = +schuif.value;
    };
    bij();
    schuif.oninput = bij;
  }
  // Titelvelden onthouden hun waarde, ook als het paneel opnieuw getekend wordt.
  [['in-titel','titel'],['in-eyebrow','eyebrow'],
   ['in-ondertitel','ondertitel'],['in-slot','slottekst']].forEach(([id,sleutel])=>{
    const el = $('#'+id);
    if (el) el.oninput = () => { S.titels[sleutel] = el.value; };
  });
  // --- beweging en geluid per shot ---
  const schuifBind = (kies, veld, formaat) => {
    const el = $(`#paneel [${kies}]`);
    if (!el) return;
    const bij = (schrijf) => {
      const b = S.edl?.video?.[S.gekozen]; if (!b) return;
      const min=+el.min, max=+el.max;
      el.style.setProperty('--vul', ((el.value-min)/(max-min)*100)+'%');
      el.nextElementSibling.textContent = formaat(+el.value);
      if (schrijf && b[veld] !== +el.value){ b[veld] = +el.value; S.vuil = true; }
    };
    bij(false);
    el.oninput = () => bij(true);
    el.onchange = () => { bewaar(); bij(true); tekenAlles(); };
  };
  schuifBind('data-snelheid',   'snelheid',    v => v.toFixed(2)+'×');
  schuifBind('data-bevriezen',  'bevriezen',   v => v.toFixed(1)+'s');
  schuifBind('data-geluid',     'geluid',      v => Math.round(v*100)+'%');
  schuifBind('data-geluidvoor', 'geluid_voor', v => v.toFixed(1)+'s');
  schuifBind('data-geluidna',   'geluid_na',   v => v.toFixed(1)+'s');

  const review = $('#btn-review');
  if (review) review.onclick = nakijken;

  const vergeet = $('#lnk-vergeet');
  if (vergeet) vergeet.onclick = e => { e.preventDefault(); vergeetStijl(); };

  $$('#paneel .vouw').forEach(d => d.addEventListener('toggle', () => {
    if (d.open) S.openSecties.add(d.dataset.sectie);
    else S.openSecties.delete(d.dataset.sectie);
  }));

  $$('#paneel [data-zoom]').forEach(el => el.onclick = () => {
    const b = S.edl?.video?.[S.gekozen]; if (!b) return;
    bewaar(); b.zoom = el.dataset.zoom; S.vuil = true;
    $$('#paneel [data-zoom]').forEach(x => x.classList.toggle('aan', x===el));
    tekenAlles();
  });

  // --- overgangen ---
  $$('#paneel [data-overgang]').forEach(el => el.onclick = () => {
    const b = S.edl?.video?.[S.gekozen]; if (!b) return;
    bewaar();
    const duur = +($('#paneel [data-overgangduur]')?.value || 0.3);
    b.overgang_in = {soort: el.dataset.overgang,
                     duur: el.dataset.overgang === 'snede' ? 0 : duur};
    S.vuil = true;
    $$('#paneel [data-overgang]').forEach(x => x.classList.toggle('aan', x===el));
    tekenAlles();
  });
  const od = $('#paneel [data-overgangduur]');
  if (od){
    const bij = () => {
      const b = S.edl?.video?.[S.gekozen]; if (!b) return;
      const min=+od.min, max=+od.max;
      od.style.setProperty('--vul', ((od.value-min)/(max-min)*100)+'%');
      od.nextElementSibling.textContent = (+od.value).toFixed(2)+'s';
      if ((b.overgang_in?.soort||'snede') !== 'snede'){
        b.overgang_in = {...b.overgang_in, duur:+od.value}; S.vuil = true;
      }
    };
    bij(); od.oninput = bij;
  }

  // --- titel-editor ---
  $$('#paneel [data-ov]').forEach(el => el.onclick = () => kiesOverlay(+el.dataset.ov));
  $$('#paneel [data-veld]').forEach(el => el.oninput = () =>
    wijzigOverlay(el.dataset.veld, el.value));
  $$('#paneel [data-pos]').forEach(el => el.onclick = () => {
    wijzigOverlay('positie', el.dataset.pos);
    $$('#paneel [data-pos]').forEach(x => x.classList.toggle('aan', x===el));
  });
  $$('#paneel [data-maat]').forEach(el => el.onclick = () => {
    wijzigOverlay('grootte', el.dataset.maat);
    $$('#paneel [data-maat]').forEach(x => x.classList.toggle('aan', x===el));
  });
  $$('#paneel [data-kleur]').forEach(el => el.onclick = () => {
    wijzigOverlay('kleur', el.dataset.kleur);
    const k = $('#paneel [data-kleurkiezer]'); if (k) k.value = el.dataset.kleur;
    $$('#paneel [data-kleur]').forEach(x => x.classList.toggle('aan', x===el));
    $$('#paneel [data-tstijl] .tk').forEach(x => x.style.setProperty('--accent', el.dataset.kleur));
  });
  const kiezer = $('#paneel [data-kleurkiezer]');
  if (kiezer) kiezer.oninput = () => {
    wijzigOverlay('kleur', kiezer.value);
    $$('#paneel [data-kleur]').forEach(x => x.classList.remove('aan'));
    $$('#paneel [data-tstijl] .tk').forEach(x => x.style.setProperty('--accent', kiezer.value));
  };
  const tk = $('#paneel [data-tekstkleur]');
  if (tk) tk.oninput = () => wijzigOverlay('tekstkleur', tk.value);
  $$('#paneel [data-tstijl]').forEach(el => el.onclick = () => {
    wijzigOverlay('stijl', el.dataset.tstijl);
    $$('#paneel [data-tstijl]').forEach(x => x.classList.toggle('aan', x===el));
  });

  $$('#paneel [data-vorm]').forEach(el => el.onclick = () => {
    S.vorm = el.dataset.vorm;
    $$('#paneel [data-vorm]').forEach(x=>x.classList.toggle('aan', x===el));
  });
  $$('#paneel [data-stijl]').forEach(el => el.onclick = () => {
    S.stijl = el.dataset.stijl; toonPaneel();
    const s = S.stijlen.find(x=>x.naam===S.stijl);
    toast(`Stijl: ${s.titel}. Klik “Monteer opnieuw” om hem toe te passen.`);
  });
  $$('#paneel [data-clip]').forEach(el => el.onchange = () => {
    if (el.checked) S.uitgesloten.delete(el.dataset.clip); else S.uitgesloten.add(el.dataset.clip);
    toonPaneel();
  });
  $$('#paneel [data-kand]').forEach(el => el.onclick = () =>
    vervang(S.gekozen, S.kandidaten[+el.dataset.kand]));
  $$('#paneel [data-doe]').forEach(el => el.onclick = async () => {
    const doe = el.dataset.doe;
    if (doe==='weg') verwijder(S.gekozen);
    if (doe==='opvullen') verwijder(S.gekozen, 'opvullen');
    if (doe==='vast') zetVast(S.gekozen);
    if (doe==='nieuw-titel') nieuweTitel('titel');
    if (doe==='nieuw-eind') nieuweTitel('eindkaart');
    if (doe==='ov-weg') verwijderOverlay();
    if (doe==='ondertitels'){
      el.disabled = true; el.textContent = 'Bezig…';
      try{
        await api('/api/ondertitels',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({stijl:$('#ot-stijl').value, grootte:$('#ot-grootte').value})});
        toast('Ondertitels worden gemaakt. Dat kan even duren.');
        // Wachten tot de achtergrondtaak klaar is en dan de EDL herladen.
        const wachtLus = setInterval(async () => {
          try{
            const s = await api('/api/status');
            if (!s.bezig){
              clearInterval(wachtLus);
              S.edl = await api('/api/edl');
              tekenAlles(); toonPaneel();
              const n = (()=>{ try{ return JSON.parse(
                S.edl.overlay.find(x=>x.soort==='ondertitels')?.inhoud?.regels||'[]').length; }
                catch{ return 0; } })();
              toast(n ? `${n} ondertitelregels toegevoegd.` : 'Geen spraak gevonden in dit materiaal.');
            }
          }catch{ clearInterval(wachtLus); }
        }, 2000);
      }catch(e){ toast('Mislukt: '+e.message, true); }
      el.disabled = false; el.textContent = 'Maak ondertitels';
    }
    if (doe==='overgang-alles'){
      const b = S.edl?.video?.[S.gekozen]; if (!b) return;
      bewaar();
      const over = {...(b.overgang_in || {soort:'snede', duur:0})};
      // Het eerste shot houdt zijn eigen instap; die hoort bij het begin
      // van de video, niet bij een overgang tussen twee shots.
      S.edl.video.slice(1).forEach(x => x.overgang_in = {...over});
      S.vuil = true; tekenAlles();
      toast(`Overgang "${over.soort}" op ${S.edl.video.length - 1} snedes gezet.`);
    }
    if (doe==='regie') monteer(el);
    if (doe==='ruil'){
      if (S.kandidaten){ S.kandidaten=null; toonPaneel(); return; }
      el.disabled=true; el.textContent='Zoeken…';
      try{
        const b=S.edl.video[S.gekozen];
        const r=await api('/api/kandidaten',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({duur:b.duur, gebruikt:S.edl.video.map(x=>({clip:x.clip,bron_start:x.bron_start}))})});
        S.kandidaten=r.kandidaten;
        S.openSecties.add('vervangen');  // anders klapt de lijst meteen weg
        toonPaneel();
      }catch(e){ toast('Mislukt: '+e.message, true); el.disabled=false; }
    }
  });
}

   Bediening
================================================================== */
function bind(){
  vA=$('#v1'); vB=$('#v2'); S.actieveVideo=vA;

  $$('.tab').forEach(t => t.onclick = () => { tab=t.dataset.tab; zetTab(); toonPaneel(); });

  $('#btn-start').onclick = () => {
    if (S.vuil && !confirm('Er zijn niet-opgeslagen wijzigingen. Toch terug?')) return;
    S.vuil = false;
    location.href = '/?project=' + encodeURIComponent(S.projectnaam || '');
  };
  $('#btn-speel').onclick = () => S.speelt?pauze():speel();
  $('#btn-begin').onclick = () => { pauze(); ganaar(0,true); };
  $('#btn-vorig').onclick = () => { const i=blokOp(S.tijd); if(i>0){pauze(); ganaar(S.edl.video[i-1].tijdlijn_start+0.02,true);} };
  $('#btn-volgend').onclick = () => { const i=blokOp(S.tijd); if(i>=0&&S.edl.video[i+1]){pauze(); ganaar(S.edl.video[i+1].tijdlijn_start+0.02,true);} };
  $('#btn-opslaan').onclick = opslaan;
  $('#btn-terug').onclick = ongedaan;
  $('#btn-snel').onclick = () => render(true);
  $('#btn-render').onclick = () => render(false);
  $('#zoom-in').onclick = () => { S.pxs=klem(S.pxs*1.5,2,300); tekenAlles(); };
  $('#zoom-uit').onclick = () => { S.pxs=klem(S.pxs/1.5,2,300); tekenAlles(); };
  $('#toon-secties').onchange = () => tekenAlles();

  const scroll=$('#tl-scroll');
  let scrubben=false;

  scroll.addEventListener('mousedown', e => {
    const rect=$('#tl-inhoud').getBoundingClientRect();
    const t=naarT(e.clientX-rect.left);

    // Titels op het overlay-spoor: zelfde slepen en trimmen als videoblokken.
    const olay = e.target.closest('.olay');
    if (olay){
      const i = +olay.dataset.o;
      kiesOverlay(i);
      const greep = e.target.closest('.greep');
      const o = S.edl.overlay[i];
      bewaar();
      S.sleep = { overlay:i, startX:e.clientX,
        greep: greep ? (greep.classList.contains('links')?'l':'r') : null,
        origStart:o.tijdlijn_start, origDuur:o.duur };
      e.preventDefault();
      return;
    }

    const blok=e.target.closest('.blok');
    if (!blok){
      if (e.target.closest('.liniaal')||e.target.closest('.spoor')){ pauze(); ganaar(t,true); scrubben=true; }
      return;
    }
    const i=+blok.dataset.i;
    kies(i);
    const greep=e.target.closest('.greep');
    if (!greep){ pauze(); ganaar(S.edl.video[i].tijdlijn_start+0.05, true); }
    bewaar();
    S.sleep={ i, startX:e.clientX, greep: greep?(greep.classList.contains('links')?'l':'r'):null,
      origStart:S.edl.video[i].tijdlijn_start, origDuur:S.edl.video[i].duur, origBron:S.edl.video[i].bron_start };
    blok.classList.add('sleept');
    e.preventDefault();
  });

  window.addEventListener('mousemove', e => {
    const rect=$('#tl-inhoud').getBoundingClientRect();
    if (scrubben){ ganaar(naarT(e.clientX-rect.left), true); return; }
    if (!S.sleep) return;

    if (S.sleep.overlay !== undefined){
      const o = S.edl.overlay[S.sleep.overlay];
      const dt = naarT(e.clientX - S.sleep.startX);
      const klik = $('#snap').checked;
      if (S.sleep.greep === 'l'){
        let ns = S.sleep.origStart + dt; if (klik) ns = dichtstbijzijndeBeat(ns);
        ns = klem(ns, 0, S.sleep.origStart + S.sleep.origDuur - 0.5);
        o.duur = +(S.sleep.origStart + S.sleep.origDuur - ns).toFixed(3);
        o.tijdlijn_start = +ns.toFixed(3);
      } else if (S.sleep.greep === 'r'){
        let ne = S.sleep.origStart + S.sleep.origDuur + dt; if (klik) ne = dichtstbijzijndeBeat(ne);
        o.duur = +klem(ne - o.tijdlijn_start, 0.5, 30).toFixed(3);
      } else {
        let ns = S.sleep.origStart + dt; if (klik) ns = dichtstbijzijndeBeat(ns);
        o.tijdlijn_start = +klem(ns, 0, Math.max(0, duur() - 0.5)).toFixed(3);
      }
      S.vuil = true; tekenOverlays();
      $('#tl-status').textContent =
        `titel · ${o.tijdlijn_start.toFixed(2)}s +${o.duur.toFixed(2)}s · niet opgeslagen`;
      return;
    }

    const b=S.edl.video[S.sleep.i];
    const dt=naarT(e.clientX-S.sleep.startX), klik=$('#snap').checked;
    if (S.sleep.greep==='l'){
      let ns=S.sleep.origStart+dt; if(klik) ns=dichtstbijzijndeBeat(ns);
      ns=klem(ns, 0, S.sleep.origStart+S.sleep.origDuur-0.2);
      const v=ns-S.sleep.origStart;
      b.tijdlijn_start=+ns.toFixed(3);
      b.duur=+(S.sleep.origDuur-v).toFixed(3);
      b.bron_start=+Math.max(0,S.sleep.origBron+v).toFixed(3);
    } else if (S.sleep.greep==='r'){
      let ne=S.sleep.origStart+S.sleep.origDuur+dt; if(klik) ne=dichtstbijzijndeBeat(ne);
      b.duur=+klem(ne-b.tijdlijn_start,0.2,30).toFixed(3);
    } else {
      let ns=S.sleep.origStart+dt; if(klik) ns=dichtstbijzijndeBeat(ns);
      b.tijdlijn_start=+Math.max(0,ns).toFixed(3);
    }
    b.frames=Math.round(b.duur*(S.edl.canvas.fps||30));
    // Alleen als er echt iets verschoven is. Een klik geeft altijd een minieme
    // muisbeweging; zonder deze controle staat er na elke klik "niet opgeslagen".
    if (Math.abs(b.tijdlijn_start-S.sleep.origStart) > 1e-4 ||
        Math.abs(b.duur-S.sleep.origDuur) > 1e-4) S.vuil=true;
    tekenBlokken();
    $('#tl-status').textContent=`${b.clip} · ${b.tijdlijn_start.toFixed(2)}s +${b.duur.toFixed(2)}s · niet opgeslagen`;
  });

  window.addEventListener('mouseup', () => {
    scrubben=false;
    if (S.sleep){
      $$('.blok.sleept').forEach(n=>n.classList.remove('sleept'));
      if (S.sleep.overlay !== undefined){
        const actief = S.edl.overlay[S.sleep.overlay];
        S.edl.overlay.sort((a,b)=>a.tijdlijn_start-b.tijdlijn_start);
        S.gekozenOverlay = S.edl.overlay.indexOf(actief);
      } else {
        S.edl.video.sort((a,b)=>a.tijdlijn_start-b.tijdlijn_start);
      }
      S.sleep=null; tekenAlles(); toonPaneel();
    }
  });

  // Zoomen op de tijdlijn met een gewone scroll. Bewust niet met ctrl of cmd:
  // dat is browserzoom en die duwt de interface buiten beeld.
  scroll.addEventListener('wheel', e => {
    if (e.ctrlKey||e.metaKey) return;      // wordt hieronder al geblokkeerd
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;   // horizontaal scrollen
    e.preventDefault();
    const rect=$('#tl-inhoud').getBoundingClientRect();
    const tOnder=naarT(e.clientX-rect.left);
    S.pxs=klem(S.pxs*(e.deltaY<0?1.12:1/1.12), 2, 300);
    tekenAlles();
    scroll.scrollLeft=naarX(tOnder)-(e.clientX-scroll.getBoundingClientRect().left);
  }, {passive:false});

  // Browserzoom volledig blokkeren: bij inzoomen valt het rechterpaneel
  // buiten beeld en is de tijdlijn niet meer bruikbaar.
  window.addEventListener('wheel', e => { if (e.ctrlKey||e.metaKey) e.preventDefault(); }, {passive:false});
  window.addEventListener('gesturestart', e => e.preventDefault());
  window.addEventListener('gesturechange', e => e.preventDefault());

  window.addEventListener('keydown', e => {
    const cmd = e.metaKey||e.ctrlKey;
    if (cmd && ['+','-','=','0'].includes(e.key)){ e.preventDefault(); return; }
    if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
    if (cmd && e.key==='s'){ e.preventDefault(); opslaan(); return; }
    if (cmd && e.key==='z'){ e.preventDefault(); ongedaan(); return; }
    if (e.code==='Space'){ e.preventDefault(); S.speelt?pauze():speel(); }
    if (e.key==='ArrowLeft'){ pauze(); ganaar(S.tijd-(e.shiftKey?1:1/30), true); }
    if (e.key==='ArrowRight'){ pauze(); ganaar(S.tijd+(e.shiftKey?1:1/30), true); }
    if (e.key==='Home'){ ganaar(0,true); }
    if (e.key==='l'||e.key==='L'){ zetVast(S.gekozen); }
    if (e.key==='Backspace'||e.key==='Delete'){
      // Verwijdert wat er ook geselecteerd is - shot of titel, zoals in een
      // echte editor. Niets geselecteerd? Dan gebeurt er niets.
      e.preventDefault();
      if (S.gekozenOverlay !== null) verwijderOverlay();
      else if (S.gekozen !== null) verwijder(S.gekozen);
      else toast('Klik eerst een shot of titel aan.');
    }
    if (e.key==='['){ $('#btn-vorig').click(); }
    if (e.key===']'){ $('#btn-volgend').click(); }
  });

  window.addEventListener('resize', () => { zetDoek(); tekenAlles(); });
  window.addEventListener('beforeunload', e => { if (S.vuil){ e.preventDefault(); e.returnValue=''; } });
}

bind();
laad().then(()=>{ zetTab(); toonPaneel(); ganaar(0,true); })
      .catch(e => { $('#laden').innerHTML =
        `<div style="text-align:center;color:var(--fout);font-size:14px">${e.message}</div>`; });
</script>
</body>
</html>
